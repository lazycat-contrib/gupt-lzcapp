version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/gupt.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: gupt

build:
  run_buildscript: false

images:
  - id: gupt
    target: service
    service: gupt
    source: ghcr.io/besoeasy/gupt
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: GUPT
    summary: "自托管端到端加密即时通讯"
